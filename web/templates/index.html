<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon Map Builder — dev-прототип</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #14100a; color: #e8e2d4; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #1f1a12; border-bottom: 1px solid #3a3124; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: 1px; }
  .tag { font-size: 11px; opacity: .6; margin-right: 12px; }
  .toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .btn { padding: 6px 12px; border: 1px solid #4a3f2e; border-radius: 6px; background: #2a241a; color: inherit; cursor: pointer; font-size: 13px; }
  .btn:hover { background: #3a3120; }
  .btn.active { background: #6b5427; border-color: #a08030; box-shadow: 0 0 0 1px #a08030; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; overflow: auto; }
  #canvas-wrap { background: #201b12; border: 1px solid #4a3f2e; border-radius: 6px; padding: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  canvas { display: block; max-width: 100%; height: auto; cursor: crosshair; touch-action: none; image-rendering: pixelated; }
  #statusbar { display: flex; gap: 18px; font-size: 13px; opacity: .85; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .badge { background:#2a241a; border:1px solid #3a3124; padding:2px 8px; border-radius:4px; }
</style>
</head>
<body>

<header>
  <h1>⚔ DUNGEON MAP BUILDER</h1>
  <span class="tag">dev-прототип</span>
  <div class="toolbar">
    <button class="btn active" data-tool="wall">🖌 Стена</button>
    <button class="btn" data-tool="floor">🪣 Пол</button>
    <button class="btn" data-tool="door">🚪 Дверь</button>
    <button class="btn" data-tool="empty">🧹 Стереть</button>
    <span style="opacity:.4">|</span>
    <button class="btn" id="btn-gen">⚙ Сгенерировать</button>
    <button class="btn" id="btn-clear">🗑 Очистить</button>
  </div>
</header>

<main>
  <div id="canvas-wrap">
    <!-- CELL = 16px для лучшей видимости мелких объектов, сетка 64x32 => 1024x512 -->
    <canvas id="map" width="1024" height="512"></canvas>
  </div>
  <div id="statusbar">
    <span class="badge">инструмент: <b id="st-tool">стена</b></span>
    <span class="badge">курсор: <span id="st-pos">—</span></span>
  </div>
</main>

<!-- Подключаем наш генератор -->
<script src="/js/bsp.js"></script>

<script>
/* ══════════════════════════════════════════════════════════════════
   1. КОНСТАНТЫ И СОСТОЯНИЕ
   ══════════════════════════════════════════════════════════════════ */
const COLS = 64, ROWS = 32, CELL = 16;

// Сопоставление строковых имен из bsp.js с числами и цветами
const TILE_TYPES = {
    'stone': 0, 'wall': 1, 'floor': 2, 'door': 3,
    'trap': 4, 'treasure': 5, 'goblin': 6, 'boss': 7, 'light': 8, 'stairs': 9, 'empty': 0
};

const COLORS = {
    0: '#26221b', // stone / empty
    1: '#3e3a33', // wall
    2: '#b3a184', // floor
    3: '#8a5426', // door
    4: '#a02020', // trap (красный)
    5: '#ffd700', // treasure (золотой)
    6: '#40a040', // goblin (зеленый)
    7: '#ff4040', // boss (ярко-красный)
    8: '#ffff80', // light (светло-желтый)
    9: '#ffffff'  // stairs (белый)
};

const grid = new Uint8Array(COLS * ROWS);
const idx = (x, y) => y * COLS + x;

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');

let currentTool = TILE_TYPES['wall'];
let painting = false;
let prevX = -1, prevY = -1;

/* ══════════════════════════════════════════════════════════════════
   2. ОТРИСОВКА
   ══════════════════════════════════════════════════════════════════ */
function draw() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      ctx.fillStyle = COLORS[grid[idx(x, y)]] || COLORS[0];
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }
  // Сетка поверх (опционально, можно закомментировать для чистоты)
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= COLS; x++) { ctx.moveTo(x * CELL + 0.5, 0); ctx.lineTo(x * CELL + 0.5, ROWS * CELL); }
  for (let y = 0; y <= ROWS; y++) { ctx.moveTo(0, y * CELL + 0.5); ctx.lineTo(COLS * CELL, y * CELL + 0.5); }
  ctx.stroke();
}

/* ══════════════════════════════════════════════════════════════════
   3. ВЫЗОВ ГЕНЕРАТОРА ИЗ bsp.js
   ══════════════════════════════════════════════════════════════════ */
function generateAndDraw() {
    const config = {
        width: COLS,
        height: ROWS,
        max_rooms: 12,
        min_room_xy: 4,
        max_room_xy: 10,
        rooms_overlap: true,
        random_connections: 1,
        random_spurs: 0
    };

    // Вызываем функцию из bsp.js
    const level2D = generateDungeonMap(config);

    // Преобразуем 2D-массив строк в 1D-массив чисел для нашего Canvas
    for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
            const tileName = level2D[y][x];
            grid[idx(x, y)] = TILE_TYPES[tileName] !== undefined ? TILE_TYPES[tileName] : 0;
        }
    }
    draw();
}

/* ══════════════════════════════════════════════════════════════════
   4. ВВОД: рисование мышью
   ══════════════════════════════════════════════════════════════════ */
function paintLine(x0, y0, x1, y1) {
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  for (;;) {
    if (x0 >= 0 && y0 >= 0 && x0 < COLS && y0 < ROWS) grid[idx(x0, y0)] = currentTool;
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx)  { err += dx; y0 += sy; }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  painting = true;
  const c = cellFromEvent(e);
  prevX = c.x; prevY = c.y;
  paintLine(prevX, prevY, prevX, prevY);
  draw();
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  const c = cellFromEvent(e);
  document.getElementById('st-pos').textContent = `${c.x},${c.y}`;
  if (painting) {
    paintLine(prevX, prevY, c.x, c.y);
    prevX = c.x; prevY = c.y;
    draw();
  }
});

canvas.addEventListener('pointerup', () => { painting = false; });
canvas.addEventListener('pointerleave', () => { painting = false; document.getElementById('st-pos').textContent = '—'; });

function cellFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const sx = canvas.width / r.width;
  const sy = canvas.height / r.height;
  const x = ((e.clientX - r.left) * sx / CELL) | 0;
  const y = ((e.clientY - r.top)  * sy / CELL) | 0;
  return { x: Math.max(0, Math.min(COLS - 1, x)), y: Math.max(0, Math.min(ROWS - 1, y)) };
}

/* ══════════════════════════════════════════════════════════════════
   5. UI: тулбар и кнопки
   ══════════════════════════════════════════════════════════════════ */
const TOOL_LABEL = { [TILE_TYPES['wall']]: 'стена', [TILE_TYPES['floor']]: 'пол', [TILE_TYPES['door']]: 'дверь', [TILE_TYPES['empty']]: 'стереть' };

document.querySelectorAll('.toolbar .btn[data-tool]').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.toolbar .btn[data-tool]').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentTool = TILE_TYPES[btn.dataset.tool];
    document.getElementById('st-tool').textContent = TOOL_LABEL[currentTool] || btn.dataset.tool;
  });
});

// Привязываем кнопку генерации к нашей новой функции
document.getElementById('btn-gen').addEventListener('click', generateAndDraw);
document.getElementById('btn-clear').addEventListener('click', () => { grid.fill(0); draw(); });

// Генерируем карту сразу при загрузке страницы
generateAndDraw();
</script>
</body>
</html>
